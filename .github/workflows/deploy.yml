name: Deploy to server

on:
  push:
    branches: [test, main, pre, AML]
  workflow_dispatch:

jobs:
  deploy:
    # 运行jobs的服务器，因gzlh_main分支的服务器限制端口22入站，因此使用自托管 runner，其他分支使用GitHub托管 Ubuntu 最新版本
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      # 根据分支选择不同的部署目标主机和用户，在 Actions 环境变量中拼接出完整的 Secret / Variable 名称
      DEPLOY_HOST: ${{ github.ref_name }}_HOST
      DEPLOY_USERNAME: ${{ github.ref_name }}_USERNAME
      DEPLOY_ENV_FILE: ${{ github.ref_name }}_ENV_FILE
      DEPLOY_APP_PORT: ${{ github.ref_name }}_APP_PORT
      DEPLOY_FRONTEND_PORT: ${{ github.ref_name }}_FRONTEND_PORT
      DEPLOY_DEPEND_SERVICES: ${{ github.ref_name }}_DEPEND_SERVICES

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          # 因Docker镜像名必须用小写字母，将仓库名转换为小写，导出为环境变量，供后续步骤使用（本步骤无法使用此环境变量PROJECT_NAME和BRANCH_NAME）
          tmp_name=${{ github.event.repository.name }}
          echo "PROJECT_NAME=${tmp_name,,}" >> $GITHUB_ENV
          tmp_name=${{ github.ref_name }}
          echo "BRANCH_NAME=${tmp_name,,}" >> $GITHUB_ENV

          # 设置 SSH 密钥对，用于后续步骤的 SSH/SFTP 操作（放在 $RUNNER_TEMP，避免被打进 deploy.tgz 和镜像）
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy.key"
          chmod 600 "$RUNNER_TEMP/deploy.key"
          echo "${{ secrets.DEPLOY_SFTP_KEY }}" > "$RUNNER_TEMP/sftp.key"
          chmod 600 "$RUNNER_TEMP/sftp.key"

      - name: Copy files to server
        run: |
          # 从本地复制文件到临时目录并压缩，忽略 .dockerignore 文件指定的文件
          rsync -a --delete --exclude-from=.dockerignore ./ "$RUNNER_TEMP/deploy-staging/"
          tar -C "$RUNNER_TEMP/deploy-staging" -czf "$RUNNER_TEMP/deploy.tgz" .

          # 从 GitHub Secrets 生成线上部署的 .env 文件（<<'EOF' 带引号，防止 secret 内容中的 $ / 反引号被 shell 二次展开，也就是.env原样照搬，此形式也可防止注入攻击）
          cat > "$RUNNER_TEMP/deploy.env" <<'EOF'
          ${{ secrets[env.DEPLOY_ENV_FILE] }}
          EOF

          # sftp 固定使用 send 该账号已 chroot 到 /www/wwwroot，路径以 jail 根为基准（/cicd/...），不带 /www/wwwroot 前缀
          # 定界符 EOF 不能带引号：体内 $RUNNER_TEMP/${PROJECT_NAME} 等变量需要 bash 展开
          sftp -i "$RUNNER_TEMP/sftp.key" -o StrictHostKeyChecking=accept-new -b - "send@${{ secrets[env.DEPLOY_HOST] }}" <<EOF
          -mkdir /cicd/${PROJECT_NAME}_${BRANCH_NAME}
          put "$RUNNER_TEMP/deploy.tgz" /cicd/${PROJECT_NAME}_${BRANCH_NAME}/
          put "$RUNNER_TEMP/deploy.env" /cicd/${PROJECT_NAME}_${BRANCH_NAME}/
          chmod 600 /cicd/${PROJECT_NAME}_${BRANCH_NAME}/deploy.env
          EOF

      - name: Deploy with Docker Compose
        run: |
          # 远程脚本将执行以下操作：
          # - 推荐：在服务器 deploy_run.sh 内调用仓库 deploy/build_app.sh
          #   （按 requirements/spec_exec 哈希复用 ${PROJECT_NAME}_deps 镜像，避免每次全量 pip）
          #   示例见 deploy/deploy_run.sh.example
          # - docker-compose.yml 文件中动态添加 app.depends_on 配置，确保 app 服务在依赖服务启动后启动
          # - 如果缺失，自动拉取并启动 mysql/redis/chroma 等依赖服务
          # - 总是构建并启动 app 服务，确保应用服务正常运行
          ssh -i "$RUNNER_TEMP/deploy.key" -o ServerAliveInterval=30 -o ServerAliveCountMax=5 "root@${{ secrets[env.DEPLOY_HOST] }}" "PROJECT_NAME='${PROJECT_NAME}' APP_PORT='${{ vars[env.DEPLOY_APP_PORT] || '8000' }}' DEPEND_SERVICES='${{ vars[env.DEPLOY_DEPEND_SERVICES] }}' COMMIT='${GITHUB_SHA:0:7}' ACTOR='${{ github.actor }}' FRONTEND_PORT='${{ vars[env.DEPLOY_FRONTEND_PORT] || '3000' }}' BRANCH_NAME='${BRANCH_NAME}' ./deploy_run.sh"
